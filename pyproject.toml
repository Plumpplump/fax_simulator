[project]
name = "faxer"
version = "0.1.0"
description = "A Flet fax machine transceiver: load or photograph a page, scan it into a grid of averaged grey cells, and send it line by line to another machine on the LAN - or receive and save incoming faxes."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=1.0.0",
    "flet-camera>=1.0.0",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.0",
    "flet-desktop>=1.0.0",
    "flet-web>=1.0.0",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs a Flutter device toolchain (run via `flet test`)",
]

[tool.flet]
org = "com.mycompany"
product = "faxer"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

[tool.flet.app]
path = "src"
